# Both halves locally:   docker compose up --build
#
#   web  http://localhost:${WEB_PORT:-8080}   nginx, proxies /api and /healthz to api
#   api  http://localhost:${API_PORT:-8808}   uvicorn, direct access for debugging
#
# LLM keys come from ./.env (optional; without keys every AI surface falls back
# to its computed template). Demo accounts come from ./.demo-accounts.json,
# generated by the setup command — or, without that file, set
# NTT_EXECUTIVE_EMAIL / NTT_EXECUTIVE_PASSWORD / NTT_ACCESS_SECRET in .env.
name: ntt-command-centre

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NTT_DEMO_ACCOUNTS_FILE: /run/secrets/demo_accounts
      NTT_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080}
    secrets:
      - demo_accounts
    volumes:
      - closure_cache:/app/data/generated
    ports:
      - "${API_PORT:-8808}:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

secrets:
  demo_accounts:
    file: ./.demo-accounts.json

volumes:
  closure_cache:
